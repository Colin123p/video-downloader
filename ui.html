<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Video Downloader</title>
<style>
:root{
  --bg:#09090b; --panel:#111114; --panel2:#17171b; --line:#232329; --line2:#2e2e36;
  --text:#f4f4f5; --dim:#a1a1aa; --mute:#71717a;
  --red:#ff2e3b; --red2:#ff5a4e; --redDeep:#c3101d; --redTint:rgba(255,46,59,.10);
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text); overflow:hidden; user-select:none;
  font-family:"Segoe UI Variable Display","Segoe UI Variable Text","Segoe UI","Nirmala UI","Yu Gothic UI","Malgun Gothic","Microsoft YaHei UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:-30% -10% auto -10%;height:70%;pointer-events:none;
  background:radial-gradient(ellipse at 50% 0%, rgba(255,46,59,.20), rgba(255,46,59,.05) 45%, transparent 70%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:44px 44px;mask-image:radial-gradient(ellipse at 50% 0%, #000 0%, transparent 65%)}

/* ---------- Titelleiste ---------- */
.titlebar{position:relative;z-index:5;height:46px;display:flex;align-items:center;padding:0 6px 0 16px}
.titlebar .drag{position:absolute;inset:0}
.brand{position:relative;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--dim);letter-spacing:.2px;pointer-events:none}
.brand img{width:24px;height:24px;filter:drop-shadow(0 0 10px rgba(255,46,59,.35))}
.right{margin-left:auto;display:flex;align-items:center;gap:8px;position:relative}
/* Sprache: Globus-Knopf */
.langwrap{position:relative}
.globe-btn{height:34px;display:flex;align-items:center;gap:7px;padding:0 10px 0 8px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--dim);font:inherit;font-size:12px;font-weight:700;letter-spacing:.6px;cursor:pointer;transition:border-color .2s,color .2s,box-shadow .2s,background .2s}
.globe-btn:hover,.globe-btn.open{color:var(--text);border-color:rgba(255,46,59,.5);background:#141418;box-shadow:0 0 0 3px rgba(255,46,59,.10),0 0 18px -4px rgba(255,46,59,.5)}
.globe-btn .chev{opacity:.6;transition:transform .25s}
.globe-btn.open .chev{transform:rotate(180deg)}
.globe{width:20px;height:20px;flex:none;overflow:visible}
.globe .sphere{fill:url(#gfill);stroke:currentColor;stroke-width:1.4}
.globe .grid{fill:none;stroke:currentColor;stroke-width:1.05;opacity:.75}
.globe .mer{fill:none;stroke:var(--red2);stroke-width:1.15;animation:mer 3.6s linear infinite;animation-play-state:paused}
.globe .mer.b{animation-delay:-1.2s}.globe .mer.c{animation-delay:-2.4s}
.globe-btn:hover .mer,.globe-btn.open .mer,.globe-btn.spin .mer{animation-play-state:running}
.globe .shine{fill:#fff;opacity:.16}
@keyframes mer{0%{rx:7.5px}12.5%{rx:6.9px}25%{rx:5.3px}37.5%{rx:2.9px}50%{rx:0px}62.5%{rx:2.9px}75%{rx:5.3px}87.5%{rx:6.9px}100%{rx:7.5px}}

/* Sprache: Menue */
.langmenu{position:absolute;top:calc(100% + 10px);right:0;width:300px;z-index:50;border-radius:16px;
  background:rgba(20,20,24,.97);border:1px solid var(--line2);
  box-shadow:0 24px 60px -12px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.02) inset,0 0 40px -18px rgba(255,46,59,.5);
  transform-origin:top right;opacity:0;transform:translateY(-6px) scale(.97);pointer-events:none;transition:opacity .18s ease,transform .22s cubic-bezier(.2,.9,.3,1.1)}
.langmenu.show{opacity:1;transform:none;pointer-events:auto}
.lm-head{padding:14px 14px 10px}
.lm-title{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--mute);margin:0 2px 10px}
.lm-title span:last-child{letter-spacing:.3px;text-transform:none;font-weight:600;color:var(--mute)}
.lm-search{display:flex;align-items:center;gap:9px;height:40px;padding:0 12px;border-radius:11px;background:var(--bg);border:1px solid var(--line);transition:border-color .2s,box-shadow .2s}
.lm-search:focus-within{border-color:rgba(255,46,59,.55);box-shadow:0 0 0 3px rgba(255,46,59,.10)}
.lm-search svg{color:var(--mute);flex:none}
.lm-search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:13.5px;user-select:text}
.lm-search input::placeholder{color:var(--mute)}
.lm-list{max-height:356px;overflow-y:auto;padding:0 6px 8px;scrollbar-width:thin;scrollbar-color:#2e2e36 transparent}
.lm-list::-webkit-scrollbar{width:8px}.lm-list::-webkit-scrollbar-thumb{background:#2a2a31;border-radius:8px;border:2px solid transparent;background-clip:padding-box}
.lm-sep{height:1px;background:var(--line);margin:6px 8px}
.lm-item{width:100%;display:flex;align-items:center;gap:12px;height:44px;padding:0 10px;border:0;border-radius:10px;background:none;color:var(--text);font:inherit;text-align:start;cursor:pointer;transition:background .12s}
.lm-item:hover,.lm-item.kb{background:rgba(255,255,255,.055)}
.lm-item .code{flex:none;width:30px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:10.5px;font-weight:800;letter-spacing:.6px;color:var(--dim);background:var(--panel2);border:1px solid var(--line2)}
.lm-item .nm{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.lm-item .nm b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lm-item .nm small{font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lm-item .ck{flex:none;width:18px;height:18px;color:var(--red);opacity:0}
.lm-item.on .ck{opacity:1}
.lm-item.on .code{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 0 12px rgba(255,46,59,.5)}
.lm-item.on .nm b{color:#fff}
.lm-item .code.auto{background:transparent;border-style:dashed}
.lm-empty{padding:18px 12px 22px;text-align:center;font-size:13px;color:var(--mute)}
.winbtns{display:flex;gap:2px}
.winbtns button{width:40px;height:32px;border:0;border-radius:8px;background:transparent;color:var(--dim);display:grid;place-items:center;cursor:pointer;transition:.15s}
.winbtns button:hover{background:rgba(255,255,255,.07);color:var(--text)}
.winbtns button.x:hover{background:var(--red);color:#fff}

/* ---------- Layout ---------- */
main{position:relative;z-index:2;padding:10px 40px 0;max-width:840px;margin:0 auto;height:calc(100% - 46px);display:flex;flex-direction:column}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:var(--red2);margin-bottom:10px}
.eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red)}
h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.8px;white-space:nowrap}
h1 span{background:linear-gradient(90deg,var(--red2),var(--red));-webkit-background-clip:text;background-clip:text;color:transparent}

/* Plattform-Umschalter */
.tabs{position:relative;display:flex;padding:4px;border-radius:14px;background:var(--panel);border:1px solid var(--line);flex:none}
.tabs .pill{position:absolute;top:4px;bottom:4px;left:4px;border-radius:10px;background:linear-gradient(160deg,rgba(255,46,59,.22),rgba(255,46,59,.08));box-shadow:0 0 0 1px rgba(255,46,59,.55) inset,0 6px 20px -8px rgba(255,46,59,.6);transition:transform .28s cubic-bezier(.3,.8,.3,1),width .28s}
.tabs button{position:relative;z-index:1;display:flex;align-items:center;gap:8px;height:38px;padding:0 18px;border:0;background:none;color:var(--dim);font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:color .2s;border-radius:10px}
.tabs button:hover{color:var(--text)}
.tabs button.on{color:#fff}
.tabs svg{flex:none}

/* ---------- Eingabe ---------- */
.input{display:flex;align-items:center;gap:10px;height:58px;padding:0 8px 0 18px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);transition:border-color .2s, box-shadow .2s}
.input:focus-within{border-color:rgba(255,46,59,.6);box-shadow:0 0 0 4px rgba(255,46,59,.12)}
.input svg{flex:none;color:var(--mute)}
.input input{flex:1;min-width:0;height:100%;background:transparent;border:0;outline:0;color:var(--text);font:inherit;font-size:15px;user-select:text}
.input input::placeholder{color:var(--mute)}
.btn-ghost{height:40px;padding:0 16px;border-radius:11px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;transition:.15s;white-space:nowrap}
.btn-ghost:hover{background:#202026;border-color:#3a3a44}
.btn-ghost svg{color:var(--dim)}

/* ---------- Vorschau ---------- */
.preview{margin-top:14px;height:132px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);display:flex;gap:18px;padding:14px;overflow:hidden;position:relative}
.thumb{flex:none;width:184px;height:104px;border-radius:11px;background:#1b1b20 center/cover no-repeat;position:relative;overflow:hidden}
.thumb.tall{width:62px}
.thumb .dur{position:absolute;right:6px;bottom:6px;font-size:11.5px;font-weight:600;padding:2px 6px;border-radius:5px;background:rgba(0,0,0,.78)}
.thumb.tall .dur{right:4px;bottom:4px;font-size:10.5px;padding:1px 4px}
.meta{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:7px}
.meta .t{font-size:16px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.meta .c{font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:6px;margin-top:2px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;letter-spacing:.5px;padding:3px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line2);color:var(--dim)}
.tag.hot{background:var(--redTint);border-color:rgba(255,46,59,.35);color:#ff8a82}
.empty{flex:1;display:flex;align-items:center;justify-content:center;gap:14px;color:var(--mute);font-size:13.5px;text-align:left}
.empty .ic{flex:none;width:42px;height:42px;border-radius:12px;border:1px dashed var(--line2);display:grid;place-items:center}
.sk{background:linear-gradient(90deg,#18181c 0%,#222228 50%,#18181c 100%);background-size:200% 100%;animation:sk 1.2s infinite linear;border-radius:7px}
@keyframes sk{to{background-position:-200% 0}}
.err{color:#ff8a82}

/* ---------- Optionen ---------- */
.label{font-size:12px;font-weight:600;color:var(--mute);letter-spacing:1.2px;text-transform:uppercase;margin:22px 0 10px}
.q{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.q.tt{grid-template-columns:repeat(3,1fr)}
.q button{position:relative;height:74px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;font:inherit;text-align:left;padding:12px 14px;transition:.18s;display:flex;align-items:center;gap:12px}
.q button:hover{border-color:#3a3a44;background:#141418}
.q .tx{min-width:0}
.q b{display:block;font-size:19px;font-weight:700;letter-spacing:-.3px;white-space:nowrap}
.q.tt b{font-size:15px;letter-spacing:-.1px}
.q small{display:block;font-size:12px;color:var(--mute);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q .ico{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line2);color:var(--dim);transition:.18s}
.q button.on{border-color:var(--red);background:linear-gradient(160deg,rgba(255,46,59,.16),rgba(255,46,59,.04));box-shadow:0 0 0 1px var(--red) inset,0 8px 26px -10px rgba(255,46,59,.55)}
.q button.on small{color:#ff9f98}
.q button.on .ico{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 0 16px rgba(255,46,59,.5)}
.q button.on::after{content:"";position:absolute;top:11px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red)}
.q button:disabled{opacity:.38;cursor:not-allowed;background:repeating-linear-gradient(135deg,transparent 0 7px,rgba(255,255,255,.025) 7px 14px),var(--panel)}
.q button:disabled b{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:rgba(255,46,59,.7)}
.q button:disabled:hover{border-color:var(--line);background:repeating-linear-gradient(135deg,transparent 0 7px,rgba(255,255,255,.025) 7px 14px),var(--panel)}

/* ---------- Aktion ---------- */
.action{margin-top:22px;height:118px;position:relative}
.go{width:100%;height:60px;border:0;border-radius:var(--r);cursor:pointer;color:#fff;font:inherit;font-size:16px;font-weight:700;letter-spacing:.2px;
  background:linear-gradient(180deg,var(--red2),var(--red) 55%,#e4202d);
  box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 14px 40px -12px rgba(255,46,59,.8),0 0 0 1px rgba(255,46,59,.5);
  display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .12s, filter .2s, box-shadow .2s}
.go:hover{filter:brightness(1.07);box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 18px 50px -12px rgba(255,46,59,.95),0 0 0 1px rgba(255,46,59,.6)}
.go:active{transform:scale(.985)}
.go:disabled{filter:grayscale(.6) brightness(.6);cursor:not-allowed;box-shadow:none}
.hint{text-align:center;font-size:12.5px;color:var(--mute);margin-top:12px}

.prog{display:none}
.prog .row{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
.pct{font-size:40px;font-weight:700;letter-spacing:-1.5px;line-height:1;font-variant-numeric:tabular-nums}
.pct small{font-size:20px;color:var(--dim);margin-left:2px}
.stage{font-size:13px;color:var(--dim);margin-bottom:4px}
.bar{height:10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;position:relative;overflow:hidden;
  background:linear-gradient(90deg,var(--redDeep),var(--red),var(--red2));box-shadow:0 0 18px rgba(255,46,59,.7);transition:width .12s linear}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:shine 1.4s infinite}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.stats{display:flex;gap:22px;margin-top:12px;font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.stats b{color:var(--text);font-weight:600;margin-left:4px}
.stats .cancel{margin-left:auto;background:none;border:0;color:var(--dim);font:inherit;font-size:12.5px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.stats .cancel:hover{color:var(--red2)}

.done{display:none;height:60px;border-radius:var(--r);border:1px solid rgba(255,46,59,.35);background:linear-gradient(90deg,rgba(255,46,59,.12),rgba(255,46,59,.03));align-items:center;padding:0 10px 0 16px;gap:14px}
.done .ok{width:32px;height:32px;border-radius:50%;background:var(--red);display:grid;place-items:center;box-shadow:0 0 18px rgba(255,46,59,.6);flex:none}
.done .txt{flex:1;min-width:0}
.done .txt b{display:block;font-size:14px}
.done .txt span{display:block;font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.done .btn-ghost{height:38px}
.done .play{background:#fff;color:#111;border-color:#fff}
.done .play:hover{background:#e9e9eb}
.done .play svg{color:#111}
.again{display:none;text-align:center;margin-top:12px;font-size:12.5px;color:var(--mute)}
.again a{color:var(--dim);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.again a:hover{color:var(--red2)}

/* ---------- Fusszeile ---------- */
footer{margin-top:auto;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:14px 0 18px;font-size:12.5px;color:var(--mute)}
footer .path{flex:1;min-width:0;display:flex;align-items:center;gap:9px}
footer .path span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim)}
footer button{background:none;border:0;color:var(--dim);font:inherit;font-size:12.5px;cursor:pointer;padding:6px 10px;border-radius:8px;white-space:nowrap}
footer button:hover{background:rgba(255,255,255,.06);color:var(--text)}

.toast{position:fixed;left:50%;bottom:72px;transform:translate(-50%,20px);opacity:0;transition:.25s;background:#1c1c21;border:1px solid var(--line2);padding:10px 16px;border-radius:12px;font-size:13px;z-index:10;pointer-events:none;max-width:80%}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{border-color:rgba(255,46,59,.5);color:#ffb3ad}

/* ---------- Bewertung (5 Sterne) ---------- */
.rate-btn{display:flex;align-items:center;gap:6px}
.rate-btn svg{color:var(--red2);filter:drop-shadow(0 0 6px rgba(255,46,59,.5))}
.rate-btn .mine{color:var(--text);font-weight:700}
.ratebox{position:fixed;right:32px;bottom:62px;width:350px;z-index:60;border-radius:18px;padding:20px 20px 18px;
  background:rgba(20,20,24,.98);border:1px solid var(--line2);
  box-shadow:0 26px 70px -14px rgba(0,0,0,.85),0 0 50px -20px rgba(255,46,59,.55);
  transform-origin:bottom right;opacity:0;transform:translateY(8px) scale(.97);pointer-events:none;
  transition:opacity .18s ease,transform .24s cubic-bezier(.2,.9,.3,1.1)}
[dir=rtl] .ratebox{right:auto;left:32px;transform-origin:bottom left}
.ratebox.show{opacity:1;transform:none;pointer-events:auto}
.rb-title{font-size:16px;font-weight:700;letter-spacing:-.2px;text-align:center}
.stars{display:flex;justify-content:center;gap:8px;margin:16px 0 6px}
.stars button{width:46px;height:46px;border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center;transition:transform .15s}
.stars button:hover{transform:scale(1.12)}
.stars svg{width:40px;height:40px;overflow:visible}
.stars .s-bg{fill:#1d1d23;stroke:#3a3a44;stroke-width:1.4;transition:fill .15s,stroke .15s}
.stars .s-fg{fill:url(#starG);opacity:0;transform-origin:12px 12px;transition:opacity .15s}
.stars button.lit .s-bg{stroke:rgba(255,46,59,.6)}
.stars button.lit .s-fg{opacity:1;filter:drop-shadow(0 0 7px rgba(255,46,59,.75))}
.stars button.pop .s-fg{animation:starPop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes starPop{0%{transform:scale(.4)}100%{transform:scale(1)}}
.rb-label{text-align:center;font-size:13px;font-weight:600;color:var(--red2);height:18px;letter-spacing:.2px}
.rb-text{width:100%;height:76px;margin-top:12px;resize:none;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:13.5px;padding:10px 12px;outline:0;user-select:text;transition:border-color .2s,box-shadow .2s}
.rb-text:focus{border-color:rgba(255,46,59,.55);box-shadow:0 0 0 3px rgba(255,46,59,.1)}
.rb-text::placeholder{color:var(--mute)}
.rb-send{width:100%;height:44px;margin-top:12px;border:0;border-radius:12px;cursor:pointer;color:#fff;font:inherit;font-size:14.5px;font-weight:700;
  background:linear-gradient(180deg,var(--red2),var(--red) 55%,#e4202d);box-shadow:0 10px 30px -12px rgba(255,46,59,.8);transition:filter .2s,transform .12s}
.rb-send:hover{filter:brightness(1.08)}.rb-send:active{transform:scale(.98)}
.rb-send:disabled{filter:grayscale(.7) brightness(.55);cursor:not-allowed;box-shadow:none}
.rb-note{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px;font-size:11.5px;color:var(--mute)}
.rb-thanks{display:none;text-align:center;padding:8px 0 4px}
.rb-thanks .ok{width:54px;height:54px;margin:4px auto 12px;border-radius:50%;display:grid;place-items:center;background:var(--red);box-shadow:0 0 26px rgba(255,46,59,.65);animation:starPop .5s cubic-bezier(.2,1.6,.4,1)}
.rb-thanks b{display:block;font-size:16px}
.rb-thanks span{display:block;font-size:13px;color:var(--dim);margin-top:4px}
.ratebox.done .rb-form{display:none}.ratebox.done .rb-thanks{display:block}
/* kleine Einladung nach ein paar Downloads */
.rate-nudge{position:fixed;right:32px;bottom:62px;z-index:55;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;border-radius:14px;
  background:#16161a;border:1px solid rgba(255,46,59,.35);box-shadow:0 18px 50px -14px rgba(0,0,0,.8),0 0 30px -14px rgba(255,46,59,.6);
  opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .25s,transform .3s cubic-bezier(.2,.9,.3,1.1)}
[dir=rtl] .rate-nudge{right:auto;left:32px}
.rate-nudge.show{opacity:1;transform:none;pointer-events:auto}
.rate-nudge b{font-size:13.5px;white-space:nowrap}
.rate-nudge .mini{display:flex;gap:2px}
.rate-nudge .mini button{border:0;background:none;padding:2px;cursor:pointer;color:#4a4a55;transition:color .12s,transform .12s}
.rate-nudge .mini button:hover,.rate-nudge .mini button.lit{color:var(--red2);transform:scale(1.15)}
.rate-nudge .later{border:0;background:none;color:var(--mute);font:inherit;font-size:12px;cursor:pointer;padding:6px 8px;border-radius:8px}
.rate-nudge .later:hover{color:var(--text);background:rgba(255,255,255,.06)}

/* ---------- Start-Animation (v2) ----------
   Zeitplan, synchron zu intro.wav:
   0.00-0.95  Partikel fliegen zur Mitte, Kachel erscheint, roter Ring zeichnet sich
   0.95       Pfeil landet -> Ringwelle, Funken, kurzes Wackeln, Lichtblitz (Bass-Schlag)
   1.05       Ablage-Linie faehrt aus
   1.15-1.55  Schriftzug faehrt Wort fuer Wort hoch (Glockentoene), Glanz streift darueber
   1.65       Unterzeile
   2.45       Ausblenden, App faehrt rein                                            */
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
#splash canvas{position:absolute;inset:0;width:100%;height:100%}
#splash .sp-vign{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.55) 100%);pointer-events:none}
#splash .sp-flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 44%,rgba(255,90,80,.35),transparent 55%);opacity:0;pointer-events:none}
#splash.out{animation:spOut .55s cubic-bezier(.5,0,.2,1) forwards}
@keyframes spOut{to{opacity:0;transform:scale(1.06);filter:blur(4px)}}
.sp-stage{position:relative;width:170px;height:170px;display:grid;place-items:center}
.sp-glow{position:absolute;left:50%;top:50%;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,46,59,.34) 0%,rgba(255,46,59,.10) 32%,transparent 62%);opacity:0;transform:scale(.5)}
.sp-ring{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;border:2px solid rgba(255,80,80,.8);opacity:0;box-shadow:0 0 26px rgba(255,46,59,.55),inset 0 0 26px rgba(255,46,59,.3)}
.sp-logo{position:relative;width:150px;height:150px;overflow:visible}
.sp-logo .tile{opacity:0;transform-origin:60px 60px}
.sp-logo .ring{fill:none;stroke:url(#spRingG);stroke-width:3;stroke-linecap:round;stroke-dasharray:208;stroke-dashoffset:208;transform:rotate(-90deg);transform-origin:60px 55px}
.sp-logo .disc{opacity:0;transform-origin:60px 55px}
.sp-logo .arrow{opacity:0;transform-origin:60px 55px}
.sp-logo .tray{transform-origin:60px 96px;transform:scaleX(0)}
.sp-logo .shine{opacity:0}
.sp-name{margin-top:26px;display:flex;gap:.28em;font-size:36px;font-weight:700;letter-spacing:-.8px;white-space:nowrap;height:48px;position:relative}
.sp-name .w{display:inline-block;overflow:hidden;padding:0 2px 6px}
.sp-name .w>span{display:inline-block;transform:translateY(110%)}
.sp-name .w.red>span{background:linear-gradient(90deg,var(--red2),var(--red));-webkit-background-clip:text;background-clip:text;color:transparent}
.sp-name::after{content:"";position:absolute;inset:0 -10px;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);background-size:300% 100%;background-position:120% 0;mix-blend-mode:overlay;opacity:0;pointer-events:none}
.sp-bar{width:0;height:3px;border-radius:3px;margin-top:12px;background:linear-gradient(90deg,transparent,var(--red),var(--red2),transparent);box-shadow:0 0 14px rgba(255,46,59,.8)}
.sp-tag{margin-top:14px;font-size:12px;font-weight:600;letter-spacing:3.4px;text-transform:uppercase;color:var(--mute);opacity:0}
.sp-tag b{color:var(--red2);font-weight:700}

#splash.run .sp-glow{animation:spGlow 2.2s ease-out .55s forwards}
#splash.run .sp-logo .tile{animation:spTile .7s cubic-bezier(.2,.9,.25,1) .15s forwards}
#splash.run .sp-logo .ring{animation:spDraw .6s cubic-bezier(.6,0,.3,1) .35s forwards, spRingOut .25s ease .95s forwards}
#splash.run .sp-logo .disc{animation:spDisc .35s cubic-bezier(.2,1.4,.4,1) .78s forwards}
#splash.run .sp-logo .arrow{animation:spArrow .3s cubic-bezier(.5,0,.75,0) .65s forwards, spArrowLand .45s cubic-bezier(.2,1.6,.4,1) .95s}
#splash.run .sp-logo .tray{animation:spTray .45s cubic-bezier(.2,.9,.3,1) 1.03s forwards}
#splash.run .sp-logo .shine{animation:spShine .8s ease-in-out 1.2s forwards}
#splash.run .sp-stage{animation:spShake .32s ease-out .95s}
#splash.run .sp-ring.r1{animation:spRing .9s cubic-bezier(.1,.6,.3,1) .95s forwards}
#splash.run .sp-ring.r2{animation:spRing 1.15s cubic-bezier(.1,.6,.3,1) 1.07s forwards}
#splash.run .sp-flash{animation:spFlash .7s ease-out .95s}
#splash.run .sp-name .w>span{animation:spWord .6s cubic-bezier(.2,.9,.25,1) forwards}
#splash.run .sp-name .w:nth-child(1)>span{animation-delay:1.15s}
#splash.run .sp-name .w:nth-child(2)>span{animation-delay:1.28s}
#splash.run .sp-name::after{animation:spTextShine .9s ease-in-out 1.55s forwards}
#splash.run .sp-bar{animation:spBar .75s cubic-bezier(.3,.8,.3,1) 1.4s forwards}
#splash.run .sp-tag{animation:spTag .6s ease 1.65s forwards}
@keyframes spTile{0%{opacity:0;transform:scale(.72) rotate(-8deg);filter:blur(10px)}100%{opacity:1;transform:none;filter:none}}
@keyframes spDraw{to{stroke-dashoffset:0}}
@keyframes spRingOut{to{opacity:0}}
@keyframes spDisc{0%{opacity:0;transform:scale(.55)}100%{opacity:1;transform:none}}
@keyframes spArrow{0%{opacity:0;transform:translateY(-62px)}100%{opacity:1;transform:translateY(0)}}
@keyframes spArrowLand{0%{transform:scale(1.18,.8)}100%{transform:none}}
@keyframes spTray{to{transform:scaleX(1)}}
@keyframes spShine{0%{opacity:0;transform:translateX(-40px) skewX(-18deg)}15%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translateX(230px) skewX(-18deg)}}
@keyframes spShake{0%{transform:translate(0,0)}20%{transform:translate(-3px,2px)}40%{transform:translate(3px,-2px)}60%{transform:translate(-2px,1px)}80%{transform:translate(1px,-1px)}100%{transform:none}}
@keyframes spRing{0%{opacity:.95;transform:scale(.62)}100%{opacity:0;transform:scale(3)}}
@keyframes spGlow{0%{opacity:0;transform:scale(.5)}25%{opacity:1;transform:scale(1.08)}100%{opacity:.75;transform:scale(1)}}
@keyframes spFlash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
@keyframes spWord{to{transform:none}}
@keyframes spTextShine{0%{opacity:1;background-position:120% 0}100%{opacity:1;background-position:-30% 0}}
@keyframes spBar{to{width:160px}}
@keyframes spTag{from{opacity:0;transform:translateY(6px);letter-spacing:6px}to{opacity:1;transform:none;letter-spacing:3.4px}}

/* App faehrt nach der Animation gestaffelt rein */
body.booting .titlebar>*:not(.drag),body.booting main>*{opacity:0;transform:translateY(14px)}
body.entering .titlebar>*:not(.drag),body.entering main>*{transition:opacity .5s ease,transform .6s cubic-bezier(.2,.9,.3,1)}
body.entering main>*:nth-child(1){transition-delay:.04s}body.entering main>*:nth-child(2){transition-delay:.10s}
body.entering main>*:nth-child(3){transition-delay:.16s}body.entering main>*:nth-child(4){transition-delay:.22s}
body.entering main>*:nth-child(5){transition-delay:.26s}body.entering main>*:nth-child(6){transition-delay:.30s}
body.entering main>*:nth-child(7){transition-delay:.36s}
@media (prefers-reduced-motion:reduce){#splash{display:none}body.booting .titlebar>*,body.booting main>*{opacity:1;transform:none}}

.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>

function renderLangList(){
  const q = $("lmSearch").value.trim().toLowerCase();
  const items = [];
  const sysNative = (LANGS.find(l=>l[0]===sysLang) || LANGS[1])[1];
  if (!q || (t("auto")+" auto automatic automatisch windows").toLowerCase().includes(q))
    items.push({code:"auto", native:t("auto"), sub:"Windows · "+sysNative});
  LANGS.forEach(([code,native,en])=>{
    const local = langLabel(code);
    const hay = (native+" "+en+" "+local+" "+code).toLowerCase();
    // zweite Zeile: Name in der aktuellen App-Sprache (bei der eigenen Sprache weglassen)
    if (!q || hay.includes(q)) items.push({code, native, sub: local && local.toLowerCase()!==native.toLowerCase() ? local : ""});
  });
  const list = $("lmList");
  kbIndex = -1;
  if (!items.length){ list.innerHTML = `<div class="lm-empty">${esc(t("noResult"))}</div>`; return; }
  list.innerHTML = items.map(it=>{
    const on = it.code==="auto" ? langAuto : (!langAuto && it.code===lang);
    const sep = it.code==="auto" && items.length>1 ? '<div class="lm-sep"></div>' : "";
    return `<button class="lm-item${on?" on":""}" role="option" data-code="${it.code}" aria-selected="${on}">`
      + `<span class="code${it.code==="auto"?" auto":""}">${it.code==="auto" ? AUTO_ICON : it.code.toUpperCase()}</span>`

  }).join("");

    b.onclick = ()=>chooseLang(b.dataset.code);

  });
}

  q.classList.remove("fade"); void q.offsetWidth; q.classList.add("fade");
  if (info && info.platform==="youtube" && platform==="youtube") setQualityLimits(info.maxh);
  pick(mode);
}
function setPlatform(p, keep){ if (p===platform && keep) return; platform = p; renderPlatform(false); }
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{
  if (busy || b.dataset.p===platform) return;
  setPlatform(b.dataset.p);
  const u = $("url").value.trim();
  if (u && platformOf(u)!==platform){ $("url").value=""; lastUrl=""; info=null; showEmpty(); updateGo(); }
});

/* ================= Vorschau ================= */
function showEmpty(){
  $("preview").innerHTML = `<div class="empty fade"><div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/></svg></div>${esc(t("empty"))}</div>`;
}
function showLoading(){
  const tall = platform==="tiktok" ? " tall" : "";
  $("preview").innerHTML = `<div class="thumb sk${tall}"></div><div class="meta"><div class="sk" style="height:16px;width:85%"></div><div class="sk" style="height:16px;width:55%"></div><div class="sk" style="height:12px;width:30%;margin-top:4px"></div></div>`;
}
function showError(msg){
  $("preview").innerHTML = `<div class="empty err fade"><div class="ic" style="border-color:rgba(255,46,59,.4)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 8v5M12 16.5v.01"/><circle cx="12" cy="12" r="9.5"/></svg></div><span>${esc(msg)}</span></div>`;
}
function showInfo(i){
  const tt = i.platform==="tiktok", tags = [];
  if (tt){
    tags.push(`<span class="tag hot">${t("noWm").toUpperCase()}</span>`);
    if (i.maxh) tags.push(`<span class="tag">${i.maxh}p</span>`);
  } else {
    if (i.maxh>=2160) tags.push('<span class="tag hot">4K</span>'); else if (i.maxh>=1440) tags.push('<span class="tag hot">2K</span>'); else if (i.maxh) tags.push(`<span class="tag">${i.maxh}p</span>`);
    if (i.hdr) tags.push('<span class="tag hot">HDR</span>');
    if (i.fps>=50) tags.push(`<span class="tag">${Math.round(i.fps)} FPS</span>`);
    tags.push(`<span class="tag">${t("withSound").toUpperCase()}</span>`);
  }
  const stats = [i.channel, i.views ? fmtNum(i.views)+" "+t("views") : "", tt && i.likes ? fmtNum(i.likes)+" "+t("likes") : ""].filter(Boolean).join(" · ");
  $("preview").innerHTML = `<div class="thumb${tt?" tall":""} fade" style="background-image:url('${esc(i.thumb)}')">${i.duration?`<span class="dur">${fmtTime(i.duration)}</span>`:""}</div>
    <div class="meta fade"><div class="t">${esc(i.title)}</div><div class="c">${esc(stats)}</div><div class="tags">${tags.join("")}</div></div>`;
}
/* Qualitaeten, die das Video nicht hat, sperren (z. B. kein 4K bei einem 1080p-Video).
   Ist die gewaehlte Qualitaet gesperrt, springt die Auswahl auf die beste verfuegbare. */
function setQualityLimits(maxh){
  const btns = [...document.querySelectorAll("#q button")];
  btns.forEach(b=>{
    const q = b.dataset.m, na = !!maxh && /^\d+$/.test(q) && +q > maxh;
    b.disabled = na;
    b.classList.toggle("na", na);
    b.title = na ? t("notAvail") : "";
    const sm = b.querySelector("small");
    if (na) sm.textContent = t("notAvail");
  });
  const cur = btns.find(b=>b.dataset.m===mode);
  if (!cur || cur.disabled){ const first = btns.find(b=>!b.disabled); if (first) pick(first.dataset.m); }
}

async function lookup(url){
  url = url.trim();
  if (url === lastUrl) return;
  lastUrl = url; info = null; updateGo();
  if (!url){ showEmpty(); renderPlatform(true); return; }
  const p = platformOf(url);
  if (!p){ showError(t("notLink_"+platform)); return; }
  if (p !== platform){ setPlatform(p); toast(t("switched_"+p)); }
  const id = ++lookupId; showLoading();
  const r = await api("get_info", url);
  if (id !== lookupId) return;
  if (!r || r.error){ showError(r ? r.error : t("notFound")); return; }
  info = r; showInfo(r);
  renderPlatform(true);
  updateGo();
}

/* ================= Bedienung ================= */
function pick(m){
  mode = m; document.querySelectorAll("#q button").forEach(b=>b.classList.toggle("on", b.dataset.m===m));
  $("golabel").textContent = m==="mp3" ? t("go_mp3") : m.startsWith("tt_") ? t("go_"+m) : tf("go_yt",{q:qName(m)});
  updateGo();
}
function updateGo(){
  $("go").disabled = !info || busy;
  $("hint").textContent = !info ? t("hintIdle") : mode==="mp3"||mode==="tt_audio" ? t("hintMp3") : mode==="tt_thumb" ? t("hintJpg") : mode==="tt_video" ? t("hintTT") : t("hintMp4");
}
let deb;
$("url").addEventListener("input", e=>{ clearTimeout(deb); deb=setTimeout(()=>lookup(e.target.value),450); });
$("url").addEventListener("keydown", e=>{ if(e.key==="Enter"){ if(info) start(); else lookup(e.target.value);} });
async function paste(){
  const c = await api("get_clipboard");
  if (!c){ toast(t("clipEmpty"), true); return; }
  $("url").value = c; lookup(c);
}
async function changeFolder(){ const p = await api("choose_folder"); if(p) $("folder").textContent=p; }

function view(s){ $("idle").style.display=s==="idle"?"block":"none"; $("prog").style.display=s==="prog"?"block":"none"; $("done").style.display=s==="done"?"flex":"none"; $("again").style.display=s==="done"?"block":"none"; }
function lockUI(on){ document.querySelectorAll("#q button, #tabs button").forEach(b=>b.style.pointerEvents=on?"none":""); }
async function start(){
  if (!info || busy) return;
  busy = true; updateGo(); view("prog"); lockUI(true);
  $("fill").style.width="0%"; $("pct").innerHTML='0<small>%</small>'; $("stage").textContent=t("connecting"); $("spd").textContent=$("size").textContent=$("eta").textContent="–";
  await api("download", $("url").value.trim(), mode);
}
function endBusy(){ busy=false; lockUI(false); updateGo(); }
function reset(){ $("url").value=""; lastUrl="x"; last={}; lookup(""); view("idle"); $("url").focus(); }
function fillDone(){
  $("dtitle").textContent = t("done") + " · " + last.label;
  $("dsub").textContent = (last.title||"") + (last.size ? " · " + fmtSize(last.size) : "");
  $("playlabel").textContent = last.kind==="image" ? t("open") : t("play");
}

/* ================= Rueckmeldungen aus Python ================= */
window.onProgress = p => {
  const pct = Math.max(0, Math.min(100, p.pct));
  $("fill").style.width = pct.toFixed(1)+"%";
  $("pct").innerHTML = Math.floor(pct)+"<small>%</small>";
  $("stage").textContent = p.part==="audio" ? t("loadAudio") : t("loadVideo");
  $("spd").textContent = p.speed ? nf(p.speed/1048576,1)+" MB/s" : "–";
  $("size").textContent = p.total ? fmtSize(p.done)+" / "+fmtSize(p.total) : "–";
  $("eta").textContent = p.eta!=null ? fmtTime(p.eta) : "–";
};
window.onStage = s => {
  $("stage").textContent = {merge:t("merge"), audio:t("toMp3"), thumb:t("thumb"), convert:t("convert")}[s] || s;
  if (s==="convert"){ $("fill").style.width="0%"; $("pct").innerHTML='0<small>%</small>'; $("spd").textContent=$("eta").textContent="–"; }
  else { $("fill").style.width="100%"; $("pct").innerHTML='100<small>%</small>'; }
};
window.onConvert = pct => { $("fill").style.width = pct.toFixed(1)+"%"; $("pct").innerHTML = Math.floor(pct)+"<small>%</small>"; };
window.onDone = d => {
  last = d; endBusy(); view("done"); fillDone();
  // nach dem 3. Download einmal freundlich nach einer Bewertung fragen
  if (d.rating) myRating = d.rating;
  if (d.asked) ratePrompted = true;
  if (d.downloads >= 3) setTimeout(showNudge, 1400);
};
window.onError = msg => { endBusy(); view("idle"); toast(msg==="cancelled" ? t("cancelled") : msg + t("errTip"), true); };


/* ================= Bewertung (5 Sterne) ================= */
let myRating = 0, rateSel = 0, ratePrompted = false;
function paintStars(v){ document.querySelectorAll("#stars button").forEach(b=>b.classList.toggle("lit", +b.dataset.v <= v)); $("rbLabel").textContent = v ? t("rateL"+v) : ""; }
document.querySelectorAll("#stars button").forEach(b=>{
  b.onmouseenter = ()=>paintStars(+b.dataset.v);
  b.onclick = ()=>{ rateSel = +b.dataset.v; paintStars(rateSel); b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop"); $("rbSend").disabled = false; };
});
$("stars").onmouseleave = ()=>paintStars(rateSel);
function openRate(preset){
  hideNudge(false);
  $("ratebox").classList.remove("done");
  rateSel = preset || myRating || 0; paintStars(rateSel); $("rbSend").disabled = !rateSel; $("rbText").value = "";
  $("ratebox").classList.add("show");
  if (!ratePrompted){ ratePrompted = true; api("mark_rating_prompted"); }
}
function closeRate(){ $("ratebox").classList.remove("show"); }
function toggleRate(){ $("ratebox").classList.contains("show") ? closeRate() : openRate(); }
async function sendRating(){
  if (!rateSel) return;
  await api("save_feedback", rateSel, $("rbText").value.trim());
  myRating = rateSel; showMyRating();
  $("ratebox").classList.add("done");
  setTimeout(closeRate, 2200);
}
function showMyRating(){ $("rateMine").textContent = myRating ? " " + myRating + "/5" : ""; }
function showNudge(){ if (myRating || ratePrompted) return; $("rateNudge").classList.add("show"); }
function hideNudge(remember){ $("rateNudge").classList.remove("show"); if (remember && !ratePrompted){ ratePrompted = true; api("mark_rating_prompted"); } }
document.querySelectorAll("#miniStars button").forEach(b=>{
  b.onmouseenter = ()=>document.querySelectorAll("#miniStars button").forEach(x=>x.classList.toggle("lit", +x.dataset.v <= +b.dataset.v));
  b.onclick = ()=>openRate(+b.dataset.v);
});
$("miniStars").onmouseleave = ()=>document.querySelectorAll("#miniStars button").forEach(x=>x.classList.remove("lit"));
document.addEventListener("mousedown", e=>{ if ($("ratebox").classList.contains("show") && !$("ratebox").contains(e.target) && !$("rateBtn").contains(e.target) && !$("rateNudge").contains(e.target)) closeRate(); });
document.addEventListener("keydown", e=>{ if (e.key==="Escape") closeRate(); });

/* ================= Start ================= */
/* Start-Animation v2 (Zeitplan siehe CSS). Partikel auf einem Canvas:
   0-0.95 s fliegen sie spiralfoermig zur Mitte, bei 0.95 s spruehen Funken nach aussen.
   Klick = ueberspringen. */
let introEnded = false, introResolve, introRAF = 0;
const introDone = new Promise(r=>introResolve=r);
const INTRO_IMPACT = 0.95, INTRO_END = 2.45;
function introParticles(){
  const cv = $("spCanvas"); if (!cv) return;
  const ctx = cv.getContext("2d");
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr);
  const cx = W / 2, cy = H / 2 - 52;                // Mitte des Logos
  const rnd = (a, b) => a + Math.random() * (b - a);
  const inbound = Array.from({length: 90}, () => ({
    a: rnd(0, Math.PI * 2), r0: rnd(Math.max(W, H) * .35, Math.max(W, H) * .7),
    spin: rnd(.6, 1.4) * (Math.random() < .5 ? -1 : 1), delay: rnd(0, .35), size: rnd(.8, 2.2), hue: rnd(-8, 12)
  }));
  const sparks = Array.from({length: 70}, () => ({
    a: rnd(0, Math.PI * 2), v: rnd(160, 520), size: rnd(.8, 2.6), life: rnd(.45, 1.0), hue: rnd(-10, 20)
  }));
  const t0 = performance.now();
  const ease = x => Math.pow(x, 1.9);   // erst langsam, dann rasen sie zur Mitte (wie der Riser)
  function frame(now){
    const t = (now - t0) / 1000;
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = "lighter";
    // einfliegende Partikel
    for (const p of inbound){
      const k = (t - p.delay) / (INTRO_IMPACT - p.delay);
      if (k <= 0 || k >= 1) continue;
      const e = ease(k), r = p.r0 * (1 - e) + 6, ang = p.a + p.spin * e * 1.6;
      const x = cx + Math.cos(ang) * r, y = cy + Math.sin(ang) * r;
      const al = Math.min(1, k * 3) * (1 - Math.pow(k, 6)) * .85;
      const tail = 10 + 26 * e;
      const tx = cx + Math.cos(ang - p.spin * .12) * (r + tail), ty = cy + Math.sin(ang - p.spin * .12) * (r + tail);
      const g = ctx.createLinearGradient(tx, ty, x, y);
      g.addColorStop(0, `hsla(${355 + p.hue},100%,62%,0)`); g.addColorStop(1, `hsla(${355 + p.hue},100%,66%,${al})`);
      ctx.strokeStyle = g; ctx.lineWidth = p.size; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(x, y); ctx.stroke();
    }
    // Funken beim Aufprall
    const ts = t - INTRO_IMPACT;
    if (ts > 0){
      for (const s of sparks){
        const k = ts / s.life; if (k >= 1) continue;
        const d = s.v * (1 - Math.pow(1 - Math.min(1, ts / .9), 2)) * .55 + 40;
        const x = cx + Math.cos(s.a) * d, y = cy + Math.sin(s.a) * d + 60 * ts * ts;
        const al = (1 - k) * .9;
        ctx.fillStyle = `hsla(${355 + s.hue},100%,${70 - k * 20}%,${al})`;
        ctx.beginPath(); ctx.arc(x, y, s.size * (1 - k * .5), 0, Math.PI * 2); ctx.fill();
      }
    }
    if (t < INTRO_END && !introEnded) introRAF = requestAnimationFrame(frame);
  }
  introRAF = requestAnimationFrame(frame);
}
function startIntro(){
  if ($("splash").classList.contains("run")) return;
  void $("splash").offsetWidth;
  $("splash").classList.add("run");
  api("play_intro");
  introParticles();
  setTimeout(endIntro, INTRO_END * 1000);
}
function endIntro(){
  if (introEnded) return; introEnded = true;
  cancelAnimationFrame(introRAF);
  $("splash").classList.add("out");
  document.body.classList.add("entering");
  requestAnimationFrame(()=>document.body.classList.remove("booting"));
  setTimeout(()=>{ $("splash").remove(); document.body.classList.remove("entering"); introResolve(); }, 900);
}
async function init(){
  const s = await api("get_state") || {};
  if (s.syslang) sysLang = pickLang(s.syslang);
  if (s.lang) lang = pickLang(s.lang);
  langAuto = s.auto !== false;
  myRating = s.rating || 0; ratePrompted = !!s.asked; showMyRating();
  applyLang();
  $("folder").textContent = s.folder || "";
  await introDone;
  $("globeBtn").classList.add("spin"); setTimeout(()=>$("globeBtn").classList.remove("spin"), 1800);
  if (s.ytdlp === false) toast(t("noYtdlp"), true);
  else if (s.ffmpeg === false) toast(t("noFfmpeg"), true);
  const c = await api("get_clipboard");
  if (c && platformOf(c) && !$("url").value){ $("url").value=c; lookup(c); toast(t("fromClip")); }
}
let booted = false;
function boot(){ if (booted) return; booted = true; startIntro(); init(); }
view("idle"); applyLang(); showEmpty();
window.addEventListener("pywebviewready", boot);
if (window.pywebview && window.pywebview.api) boot();
window.addEventListener("resize", ()=>renderPlatform(true));
window.addEventListener("focus", async ()=>{ if(busy || $("url").value || !introEnded) return; const c=await api("get_clipboard"); if(c && platformOf(c)){ $("url").value=c; lookup(c);} });
